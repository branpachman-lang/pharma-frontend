<div class="venta-modal" (click)="cancelar.emit()">
  <div class="modal-contenido" role="dialog" aria-modal="true" aria-labelledby="titulo-confirmar-venta"
    (click)="$event.stopPropagation()">
    <span class="etiqueta-modal">Revisión final</span>
    <h3 id="titulo-confirmar-venta">¿Confirmas el registro de la venta?</h3>
    <dl class="resumen">
      <div><dt>Cliente</dt><dd>{{ cliente() }}</dd></div>
      <div><dt>Productos</dt><dd>{{ cantidadProductos() }}</dd></div>
      <div><dt>Total estimado</dt><dd>{{ total() | currency:'PEN':'S/ ':'1.2-2' }}</dd></div>
    </dl>
    <p class="nota">El servidor volverá a comprobar el stock y calculará el total definitivo.</p>
    <label class="opcion-imprimir"><input type="checkbox" [checked]="imprimir()"
      (change)="imprimirChange.emit($any($event.target).checked)" /> Imprimir comprobante al registrar</label>
    <div class="acciones">
      <button type="button" class="boton" [disabled]="guardando()" (click)="cancelar.emit()">Volver</button>
      <button type="button" class="boton principal" [disabled]="guardando()" (click)="confirmar.emit()">
        {{ guardando() ? 'Registrando...' : 'Confirmar venta' }}
      </button>
    </div>
  </div>
</div>
