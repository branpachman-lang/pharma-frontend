upstream pharma_backend {
    server host.docker.internal:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # El navegador revalida el documento que referencia la version vigente.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # La compilacion de produccion genera los JS y CSS con hash.
    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Docker Desktop resuelve el anfitrion por IPv4. El alias host-gateway
    # puede incluir una IPv6 inalcanzable y provocar 502 intermitentes.
    # Se conserva /api/ al enviar la peticion al backend del anfitrion.
    location /api/ {
        proxy_pass http://pharma_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Una recarga en una ruta de Angular devuelve el documento de la SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
